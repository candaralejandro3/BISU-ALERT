name: bisu_alert_flutter
description: BISU-Alert frontend for BISU Bilar Campus
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.4.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  google_maps_flutter: ^2.9.0
  url_launcher: ^6.3.0
  google_fonts: ^7.0.0
  connectivity_plus: ^6.0.0
  flutter_local_notifications: ^17.1.0
  shared_preferences: ^2.2.0
  firebase_core: ^3.0.0
  firebase_messaging: ^15.0.0
  sensors_plus: ^7.0.0
  http: ^1.1.0
  image_picker: ^1.0.0
  audioplayers: ^6.8.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.14.1

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    # SOS siren, generated by tools/generate_siren.py
    - assets/sounds/

# Regenerate the Android launcher icon from the app logo with:
#   flutter pub run flutter_launcher_icons
flutter_launcher_icons:
  image_path: "assets/images/BISU-ALERT.png"
  android: "ic_launcher"
  min_sdk_android: 21
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: "assets/images/BISU-ALERT.png"
  adaptive_icon_foreground_inset: 18
  remove_alpha_ios: true
